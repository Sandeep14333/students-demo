<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Students.com – Career Guidance Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f7fb; }
    header { background:#1e3a8a; color:white; padding:20px; }
    section { padding:30px; }
    .card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; }
    button { background:#2563eb; color:white; border:none; padding:10px 20px; border-radius:6px; }
  </style>
</head>
<body>

<header>
  <h1>Students.com</h1>
  <p>Choose the Right College. Build the Right Career.</p>
</header>

<section>
  <div class="card">
    <h2>🎓 Find Colleges</h2>
    <p>Search colleges using government-approved data and NIRF rankings.</p>
    <button>Explore Colleges</button>
  </div>

  <div class="card">
    <h2📊 Rankings & Performance</h2>
    <p>View Tier-1, Tier-2 colleges based on NIRF & placement data.</p>
    <button>View Rankings</button>
  </div>

  <div class="card">
    <h2🧑‍🎓 Student Performa</h2>
    <p>Get personalized college recommendations.</p>
    <button>Start Now</button>
  </div>
</section>

</body>
</html>
